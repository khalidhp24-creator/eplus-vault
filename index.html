<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="#EPLUS Software & Essential Files Directory — Direct links to Eplus upgrades, database templates, network utilities, and system tools." />
  <title>#EPLUS Vault — Software & Essential Files</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#" class="brand">
        <span class="brand-mark mono">#E</span>
        <span class="brand-title" id="brand-title">#EPLUS Vault</span>
        <span class="brand-badge mono" id="brand-badge">Directory</span>
      </a>

      <div class="topbar-actions">
        <a
          href="https://www.mediafire.com/folder/alo1p7uroxir1/%23EPLUS"
          target="_blank"
          rel="noopener noreferrer"
          class="root-folder-link"
          id="root-folder-link"
          title="Open full #EPLUS MediaFire repository"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
          </svg>
          <span id="root-folder-label">Open Main MediaFire Folder</span>
        </a>

        <button
          type="button"
          class="icon-btn"
          id="theme-toggle-btn"
          aria-label="Toggle color theme"
          title="Toggle color theme"
        ></button>
      </div>
    </div>
  </header>

  <!-- Hero Section with Top Search Bar -->
  <section class="hero">
    <div class="container hero-layout">
      <div class="hero-top">
        <h1 class="hero-title" id="hero-title">#EPLUS Vault</h1>
        <p class="hero-subtitle" id="hero-subtitle">
          Essential software packages, database upgrades, system utilities, and direct MediaFire archives.
        </p>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search 352 files, drivers, SQL, Eplus versions, or passwords..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search files and software"
        />
        <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear search" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
        <kbd class="search-kbd mono" id="search-kbd">/</kbd>
      </div>
    </div>
  </section>

  <!-- Sticky Category Tabs & View Switcher -->
  <nav class="controls-bar" aria-label="Directory controls">
    <div class="container controls-inner">
      <div class="category-bar-wrap">
        <button type="button" class="cat-scroll-btn" id="cat-scroll-left" aria-label="Scroll categories left" title="Scroll left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="category-tabs" id="category-tabs" role="tablist">
          <!-- Populated dynamically by app.js -->
        </div>
        <button type="button" class="cat-scroll-btn" id="cat-scroll-right" aria-label="Scroll categories right" title="Scroll right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="view-toggle" role="group" aria-label="Layout view switcher">
        <button type="button" class="view-btn active" id="view-grid-btn" title="Grid View">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1"/>
            <rect width="7" height="7" x="14" y="3" rx="1"/>
            <rect width="7" height="7" x="14" y="14" rx="1"/>
            <rect width="7" height="7" x="3" y="14" rx="1"/>
          </svg>
          <span>Grid</span>
        </button>
        <button type="button" class="view-btn" id="view-list-btn" title="Compact List View">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" x2="21" y1="6" y2="6"/>
            <line x1="8" x2="21" y1="12" y2="12"/>
            <line x1="8" x2="21" y1="18" y2="18"/>
            <line x1="3" x2="3.01" y1="6" y2="6"/>
            <line x1="3" x2="3.01" y1="12" y2="12"/>
            <line x1="3" x2="3.01" y1="18" y2="18"/>
          </svg>
          <span>List</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Directory Content -->
  <main class="directory-main">
    <div class="container" id="directory-content">
      <!-- Populated dynamically from data.js via app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <span>#EPLUS Software &amp; Essential Files Directory</span>
      </div>
      <div class="footer-hint">
        To add or update files, edit <code>data.js</code>
      </div>
    </div>
  </footer>

  <!-- Copy Notification Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toast-message">Copied to clipboard</span>
  </div>

  <!-- Data & Application Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
